# Publishes to npm, after the tests pass, with npm trusted publishing (the job's GitHub OIDC token; npm records the
# provenance: this repository, this workflow, the commit): a tag vX.Y.Z equal to package.json's version publishes 203cli
# (https://www.npmjs.com/package/203cli).
# Set up on npmjs.com: Settings › Trusted publishing › GitHub Actions: organization 203-Systems, repository
# 203-CLI, workflow release.yml. A package that is not on npm yet cannot have it: its first version is
# published by hand (npm publish, signed in), or here with an NPM_TOKEN secret (an npm automation token, removed once
# trusted publishing is set up). A version already on npm is not published again (the job says so and passes).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  npm:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write          # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: The version the tag names, and its checks
        id: plan
        run: |
          case "$GITHUB_REF_NAME" in
            v*) want=${GITHUB_REF_NAME#v} ;;
            *) echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"; exit 1 ;;
          esac
          test "$(node scripts/203cli.mjs --version)" = "$want" || { echo "::error::CLI_VERSION is not $want"; exit 1; }
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          test "$want" = "$version" || { echo "::error::tag $GITHUB_REF_NAME is not $version (package.json)"; exit 1; }
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "::notice::$name $version is on npm already: nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.plan.outputs.skip != 'true'
        run: npm publish --provenance --access public
        env:
          # NPM_TOKEN only for a package's first version (see above); without it, setup-node's placeholder as before, and
          # trusted publishing is used.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || env.NODE_AUTH_TOKEN }}
